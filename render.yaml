# =============================================================================
# Camelot OS — Render Blueprint
#
# Deploys the three web-facing services:
#   camelot-os-orchestrator — master router + dashboard (FastAPI, port from $PORT)
#   camelot-os-concierge    — document template catalog & auto-fill API
#   camelot-os-perseus      — periodic management-report variance engine
#
# The other bots (Scout, Broker, Report, Deal, Compliance, Front Desk, Index)
# run as local subprocesses / cron jobs or via docker-compose on a VM — they
# are not deployed as Render web services by default. Uncomment the cron
# block below to run the daily Scout collection on Render.
#
# Render runs each service with:  pip install -r requirements.txt
# and starts it with the startCommand. $PORT is injected by Render.
# =============================================================================

services:
  - type: web
    name: camelot-os-orchestrator
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python orchestrator/api_server.py
    healthCheckPath: /status
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: HOST
        value: "0.0.0.0"
      - key: LOG_LEVEL
        value: INFO
      # Point the orchestrator at the Concierge service's public URL
      - key: CONCIERGE_BOT_HOST
        fromService:
          type: web
          name: camelot-os-concierge
          property: host
      - key: CONCIERGE_BOT_PORT
        value: "443"
      # Fill these in the Render dashboard (sync: false = set manually)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: HUBSPOT_API_KEY
        sync: false
      - key: NYC_OPEN_DATA_APP_TOKEN
        sync: false

  - type: web
    name: camelot-os-concierge
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python concierge_bot/main.py --serve --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: camelot-os-perseus
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python perseus_bot/main.py --serve --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: LOG_LEVEL
        value: INFO
      # Required — stores every period report and reads portfolio comparables.
      # Run perseus_bot/supabase_schema.sql in the Supabase SQL editor first.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Optional — rephrases recommendation prose only. Without it the
      # deterministic per-category mechanism text is used and no figure changes.
      - key: OPENAI_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # OPTIONAL: daily Scout Bot run (uncomment to enable)
  # ---------------------------------------------------------------------------
