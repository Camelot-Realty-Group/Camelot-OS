# concierge_bot/config.yaml
# Camelot Property Management Services Corp — Concierge Bot Configuration

bot:
  name: "Concierge Bot"
  version: "1.0.0"
  environment: "production"

camelot:
  company_name: "Camelot Property Management Services Corp"
  templates_email: "templates@camelot.nyc"

library:
  directory: "library"
  masters_directory: "masters"

autofill:
  # Templates with a merge-tag master wired for guided fill-in.
  # See templates_registry.py TEMPLATES[...]["has_autofill"].
  enabled_templates:
    - "work-order-request-form"

server:
  host: "0.0.0.0"
  port: 8004

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/concierge_bot.log"
